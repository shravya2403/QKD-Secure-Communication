[project]
name = "quantum-hybrid-qkd"
version = "0.1.0"
description = "Quantum Key Distribution system combining BB84 protocol with QOTP encryption"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Quantum Hybrid QKD Team"}
]
license = {text = "MIT"}
keywords = ["quantum", "cryptography", "QKD", "BB84", "QOTP", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "qiskit>=0.45.0",
    "qiskit-aer>=0.13.0",
    "numpy>=1.24.0",
    "qunetsim>=0.1.3",
    "pyserial>=3.5",
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
qkd = "main:run_basic_qkd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_hybrid_qkd"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=quantum_hybrid_qkd --cov-report=html --cov-report=term"
